# Nginx Reverse Proxy — Microservices API Gateway
#
# Deploy location: /etc/nginx/sites-available/microservices
# Enable with:     sudo ln -s /etc/nginx/sites-available/microservices \
#                             /etc/nginx/sites-enabled/microservices
#
# Routes:
#   /api/users/*    → user-service    :3001
#   /api/products/* → product-service :3002
#   /api/orders/*   → order-service   :3003
#   /health/*       → per-service health endpoints

upstream user_service {
    server 127.0.0.1:3001;
    keepalive 32;
}

upstream product_service {
    server 127.0.0.1:3002;
    keepalive 32;
}

upstream order_service {
    server 127.0.0.1:3003;
    keepalive 32;
}

server {
    listen 80;
    server_name _;   

    access_log /var/log/nginx/microservices-access.log;
    error_log  /var/log/nginx/microservices-error.log warn;

    # ── User Service ────────────────────────────────────────────────────────
    location /api/users/ {
        proxy_pass         http://user_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Product Service ─────────────────────────────────────────────────────
    location /api/products/ {
        proxy_pass         http://product_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Order Service ───────────────────────────────────────────────────────
    location /api/orders/ {
        proxy_pass         http://order_service;
        proxy_http_version 1.1;
        proxy_set_header   Connection      "";
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # ── Health Endpoints ────────────────────────────────────────────────────
    location /health/users    { proxy_pass http://user_service/health;    }
    location /health/products { proxy_pass http://product_service/health; }
    location /health/orders   { proxy_pass http://order_service/health;   }

    # ── Security Headers ────────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
}
