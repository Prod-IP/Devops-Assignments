# Parent values override subchart defaults.
# fullnameOverride keeps CoreDNS names stable: user-service, order-service

global:
  namespace: microservices

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "40"
    services: "10"
    configmaps: "20"
    secrets: "20"
    persistentvolumeclaims: "5"
    count/deployments.apps: "10"
    count/horizontalpodautoscalers.autoscaling: "10"

limitRange:
  enabled: true
  default:
    cpu: "500m"
    memory: "256Mi"
  defaultRequest:
    cpu: "100m"
    memory: "128Mi"
  max:
    cpu: "1"
    memory: "512Mi"
  min:
    cpu: "50m"
    memory: "64Mi"

networkPolicy:
  enabled: true

order-service:
  fullnameOverride: order-service
  replicaCount: 2
  image:
    repository: order-service
    tag: latest
    pullPolicy: Never
  service:
    type: ClusterIP
    port: 4000
    targetPort: 4000
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

user-service:
  fullnameOverride: user-service
  replicaCount: 2
  image:
    repository: user-service
    tag: latest
    pullPolicy: Never
  service:
    type: LoadBalancer
    port: 80
    targetPort: 3000
  orderServiceUrl: "http://order-service:4000"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
